name: Set up firmware tooling
description: Python, PlatformIO tools and cache, and optionally Node for the web flasher.

inputs:
  node:
    description: Also set up Node 22 with the npm cache for web/.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install Python tools
      shell: bash
      run: pip install -r requirements.txt
    - name: Cache PlatformIO packages
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
        restore-keys: platformio-${{ runner.os }}-
    - uses: actions/setup-node@v4
      if: inputs.node == 'true'
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json
