name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable version tag to publish (v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-stable-pages
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - name: Validate existing tag and reject published releases
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.VERSION;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Choose an existing stable vX.Y.Z tag.');
            }
            await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            throw new Error('This tag already has a release. Publish a new version instead.');
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
      - name: Validate Pages configuration
        uses: actions/configure-pages@v5
      - uses: ./.github/actions/setup
        with:
          node: 'true'
      # No secrets.yaml exists here, so every release build ships with OTA off.
      - name: Build every board
        run: |
          for env in $(python scripts/list_envs.py | python -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            pio run -e "$env"
          done
      - run: bash scripts/check.sh
      - name: Package the validated firmware build
        run: python scripts/package_firmware.py --version "$VERSION" --output web/public/firmware
      - name: Build the site with the release bundle
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Stage Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - name: Publish the same firmware bundle on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.repository.name }}
        run: |
          cd web/public/firmware
          for dir in */; do zip -qr "${dir%/}.zip" "$dir"; done
          gh release create "$VERSION" index.json *.zip --verify-tag --latest --title "$TITLE $VERSION" --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated release website
        id: deployment
        uses: actions/deploy-pages@v4
