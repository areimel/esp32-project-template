[platformio]
; Local, uncommitted settings; see platformio_override.ini.example.
extra_configs = platformio_override.ini

[env]
; pioarduino 55.03.312-1 = Arduino-ESP32 3.3.x (latest stable at time of pinning).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_config.py
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
; Old firmware sources move into lib/ and examples/ in later tasks.
build_src_filter = +<main.cpp>

[env:sticks3]
board = esp32-s3-devkitc-1
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32]
board = esp32dev

[env:native]
platform = native
framework =
test_framework = unity
lib_deps =
lib_ignore = board, net, display, store
build_flags = -std=gnu++17 -Itest/stubs -Iexamples/macro-clicker/include
