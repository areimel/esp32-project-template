# Copy to secrets.yaml (gitignored). Never commit real values.
# Only these keys are accepted; CI and release builds ship without this file.

# Enables OTA updates (config.yaml ota.enabled must also be true).
ota_password: "choose-a-long-random-password"

# Dev WiFi credentials, used only when no credentials were provisioned on the device.
wifi_ssid: "my-network"
wifi_password: "my-network-password"
